name: Claude Code Review

# Reviews every non-draft PR with Claude Code. On new pushes it reviews only the
# commits added since the last run, then approves or requests changes (critical
# issues only). Code owners from .github/CODEOWNERS are (re-)requested as reviewers.
#
# Requires the ANTHROPIC_API_KEY repository secret.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  request-codeowners:
    # Fork PRs get a read-only token, so they can't request reviewers.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Request review from code owners
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          # Read CODEOWNERS from the base branch so a PR can't rewrite its own reviewers.
          owners=$(gh api "repos/$REPO/contents/.github/CODEOWNERS?ref=$BASE" --jq .content | base64 -d \
            | sed 's/#.*//' | grep -oE '@[A-Za-z0-9-]+(/[A-Za-z0-9_.-]+)?' | grep -v '/' | tr -d '@' | sort -u)
          for owner in $owners; do
            if [ "${owner,,}" = "${AUTHOR,,}" ]; then
              echo "Skipping $owner (PR author)"
              continue
            fi
            gh pr edit "$PR" --repo "$REPO" --add-reviewer "$owner"
          done

  review:
    # Secrets aren't available to fork PRs, so only review branches in this repo.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EVENT: ${{ github.event.action }}
            PREVIOUS HEAD: ${{ github.event.before }}
            CURRENT HEAD: ${{ github.event.pull_request.head.sha }}

            You are reviewing a pull request for OpenScreenStudio, a Tauri (Rust + React/TypeScript)
            screen recording app. Read AGENTS.md first for project conventions.

            ## Scope
            - If EVENT is "synchronize" and `git cat-file -e <PREVIOUS HEAD>` succeeds, review only the
              new changes: `git diff <PREVIOUS HEAD> <CURRENT HEAD>`. Use `gh pr diff` and the surrounding
              code for context, but don't re-raise issues in code these commits didn't touch.
            - Otherwise (new PR, reopened, ready for review, or a force-push), review the whole PR via `gh pr diff`.

            ## What to look for
            Focus on correctness: logic bugs, crashes/panics, data loss, race conditions, resource leaks,
            security problems, broken builds, and behaviour that contradicts the PR description.
            Ignore pure style nits and anything a formatter or linter would catch.
            Verify each issue against the actual code before reporting it, and skip anything speculative.

            ## Output
            1. Post each concrete issue as an inline comment on the relevant line with
               `mcp__github_inline_comment__create_inline_comment`. Mark critical ones with "**Critical:**".
            2. Then submit exactly one review with `gh pr review <PR NUMBER> --repo <REPO>`:
               - `--request-changes` only if you found at least one CRITICAL issue: something that would
                 ship a bug, crash, data loss, security hole, or broken build. The body lists those issues.
               - `--approve` otherwise. The body is a short summary of what changed and any non-blocking notes.
               Keep the review body concise, and say whether it covers the full PR or only the new commits.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git cat-file:*)"
